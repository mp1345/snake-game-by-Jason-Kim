<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #1a1a2e;
    font-family: "Microsoft YaHei", sans-serif;
    color: #eee;
    user-select: none;
  }
  h1 { margin: 8px 0; font-size: 26px; letter-spacing: 6px; color: #4ecca3; }
  #info { margin: 4px 0 12px; font-size: 15px; color: #aaa; }
  #score { color: #ffd76e; font-weight: bold; font-size: 18px; }
  canvas {
    background: #16213e;
    border: 3px solid #4ecca3;
    border-radius: 8px;
    box-shadow: 0 0 20px rgba(78, 204, 163, .25);
  }
  #tip { margin-top: 12px; font-size: 13px; color: #888; }
  #overlay {
    position: absolute;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 10, 25, .82);
    border-radius: 8px;
    padding: 30px 50px;
  }
  #overlay h2 { color: #ff6b6b; margin: 0 0 10px; }
  #overlay p { margin: 4px 0; }
  #overlay button {
    margin-top: 16px;
    padding: 10px 34px;
    font-size: 16px;
    background: #4ecca3;
    color: #1a1a2e;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  #overlay button:hover { background: #6ee7c7; }
</style>
</head>
<body>

<h1>贪 吃 蛇</h1>
<div id="info">得分：<span id="score">0</span>　最高分：<span id="best">0</span></div>
<canvas id="game" width="480" height="480"></canvas>
<div id="tip">方向键 / WASD 控制，空格暂停，吃食物得分，撞墙或撞自己结束</div>

<div id="overlay">
  <h2>游戏结束</h2>
  <p>本局得分：<span id="finalScore">0</span></p>
  <p id="newBest" style="color:#ffd76e">刷新最高分！</p>
  <button onclick="startGame()">再来一局</button>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const GRID = 24;                     // 每格像素
const COLS = canvas.width / GRID;    // 横向格数 20
const ROWS = canvas.height / GRID;   // 纵向格数 20

let snake, dir, nextDir, food, score, best, timer, paused, gameOver;

best = Number(localStorage.getItem('snakeBest') || 0);
document.getElementById('best').textContent = best;

function startGame() {
  // 初始蛇：3 节，位于中间偏左，向右移动
  snake = [{x: 8, y: 10}, {x: 7, y: 10}, {x: 6, y: 10}];
  dir = {x: 1, y: 0};
  nextDir = {x: 1, y: 0};
  score = 0;
  paused = false;
  gameOver = false;
  document.getElementById('score').textContent = 0;
  document.getElementById('overlay').style.display = 'none';
  spawnFood();
  draw();

  clearInterval(timer);
  timer = setInterval(step, 150);   // 每 150ms 走一步，数值越小越快
}

function spawnFood() {
  do {
    food = {
      x: Math.floor(Math.random() * COLS),
      y: Math.floor(Math.random() * ROWS)
    };
  } while (snake.some(s => s.x === food.x && s.y === food.y)); // 不落在蛇身上
}

function step() {
  if (paused || gameOver) return;

  dir = nextDir;
  const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

  // 撞墙判定
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return die();
  // 撞自己判定（尾巴即将移走，不算碰撞）
  if (snake.some((s, i) => i < snake.length - 1 && s.x === head.x && s.y === head.y)) return die();

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    document.getElementById('score').textContent = score;
    spawnFood();
  } else {
    snake.pop();   // 没吃到食物则尾部移除
  }
  draw();
}

function die() {
  gameOver = true;
  clearInterval(timer);
  document.getElementById('finalScore').textContent = score;
  if (score > best) {
    best = score;
    localStorage.setItem('snakeBest', best);
    document.getElementById('best').textContent = best;
    document.getElementById('newBest').style.display = 'block';
  } else {
    document.getElementById('newBest').style.display = 'none';
  }
  document.getElementById('overlay').style.display = 'flex';
}

function draw() {
  // 背景
  ctx.fillStyle = '#16213e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 食物（红色圆点）
  ctx.fillStyle = '#ff6b6b';
  ctx.beginPath();
  ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 4, 0, Math.PI * 2);
  ctx.fill();

  // 蛇身
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? '#4ecca3' : '#3aa88a';
    ctx.fillRect(s.x * GRID + 1, s.y * GRID + 1, GRID - 2, GRID - 2);
  });

  // 暂停提示
  if (paused) {
    ctx.fillStyle = 'rgba(10, 10, 25, .7)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#eee';
    ctx.font = '24px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText('已暂停（按空格继续）', canvas.width / 2, canvas.height / 2);
  }
}

document.addEventListener('keydown', e => {
  const key = e.key;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(key)) e.preventDefault();

  if (key === ' ') {                 // 空格：暂停/继续
    if (!gameOver) { paused = !paused; draw(); }
    return;
  }
  if (gameOver && key === 'Enter') { startGame(); return; }

  const d = {
    ArrowUp:    {x: 0, y: -1}, w: {x: 0, y: -1}, W: {x: 0, y: -1},
    ArrowDown:  {x: 0, y: 1},  s: {x: 0, y: 1},  S: {x: 0, y: 1},
    ArrowLeft:  {x: -1, y: 0}, a: {x: -1, y: 0}, A: {x: -1, y: 0},
    ArrowRight: {x: 1, y: 0},  d: {x: 1, y: 0},  D: {x: 1, y: 0}
  }[key];
  if (!d) return;

  // 禁止 180 度掉头
  if (d.x === -dir.x && d.y === -dir.y) return;
  nextDir = d;
});

startGame();
</script>
</body>
</html>
